<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Developer Workshop Registration</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        @import url(https://fonts.googleapis.com/css?family=Open+Sans);
    </style>
</head>
<body>
    
    <div class="form-container">
        <h1>Developer Workshop Registration</h1>
        <form id="registration-form" action="#" method="post">

            <label for="full-name">Full Name:</label>
            <input type="text" id="full-name" name="full-name" required><br><br>


            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required><br><br>


            <div class="experience-levels">
                <label for="experince-level">Experience Level:</label>
                <select name="experince-level" id="experience-level">
                    <option value="beginner">Beginner</option>
                    <option value="intermidiate">Intermediate</option>
                    <option value="advanced">Advanced</option>
                </select> <br><br>
            </div>


            <div class="Workshop-tracks">
                <label>Workshop Track:</label> 
                <div>
                    <label for="Frontend-Web">Frontend Web</label>
                    <input type="radio" name="Frontend Web" id="Frontend-Web" value="Frontend Web">
                </div>
                
                <div>
                    <label for="Backend-APIs">Backend APIs</label>
                    <input type="radio" name="Backend-APIs" id="Backend-APIs" value="Backend APIs">
                </div>
                
                <div>
                    <label for="UIUX-Design">UI/UX Design</label>
                    <input type="radio" name="UIUX-Design" id="UIUX-Design" value="UIUX Design">
                </div>
                
            </div><br><br>
            

            <label for="notifications-update">Receive event updates Notifications? </label>
            <input type="checkbox" name="notifications-update" id="notifications-update"><br><br>


            <button type="submit" id="submit-button">Submit</button>

        </form>
    </div>

</body>
</html>
